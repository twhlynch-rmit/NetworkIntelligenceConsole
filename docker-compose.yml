services:
  postgres:
    image: postgis/postgis:15-3.3
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nic}
      POSTGRES_USER: ${POSTGRES_USER:-nic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nic_user} -d ${POSTGRES_DB:-nic}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  mock-outage-api:
    build:
      context: .
      dockerfile: services/mock-outage-api/Dockerfile
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
    depends_on:
      redis:
        condition: service_healthy

  mock-loc-api:
    build:
      context: .
      dockerfile: services/mock-loc-api/Dockerfile
    ports:
      - '3006:3006'
    environment:
      PORT: 3006
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
    depends_on:
      redis:
        condition: service_healthy

  fleet-simulator:
    build:
      context: .
      dockerfile: services/fleet-simulator/Dockerfile
    ports:
      - '3002:3002'
    environment:
      PORT: 3002
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OUTAGE_API_URL: http://mock-outage-api:3001
      LOC_API_URL: http://mock-loc-api:3006
      FLEET_SIZE: ${FLEET_SIZE:-1000}
    depends_on:
      redis:
        condition: service_healthy
      mock-outage-api:
        condition: service_started
      mock-loc-api:
        condition: service_started

  public-data-adapter:
    build:
      context: .
      dockerfile: services/public-data-adapter/Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy

  correlator:
    build:
      context: .
      dockerfile: services/correlator/Dockerfile
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-nic}
      POSTGRES_USER: ${POSTGRES_USER:-nic_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      OUTAGE_API_URL: http://mock-outage-api:3001
      LOC_API_URL: http://mock-loc-api:3006
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mock-outage-api:
        condition: service_started
      mock-loc-api:
        condition: service_started

  results-api:
    build:
      context: .
      dockerfile: services/results-api/Dockerfile
    ports:
      - '3005:3005'
    environment:
      PORT: 3005
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OUTAGE_API_URL: http://mock-outage-api:3001
      LOC_API_URL: http://mock-loc-api:3006
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-prod}
    depends_on:
      redis:
        condition: service_healthy
      mock-outage-api:
        condition: service_started
      mock-loc-api:
        condition: service_started

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - '3000:80'
    depends_on:
      - results-api

volumes:
  postgres-data:
  redis-data:
